apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secret
  namespace: personal-site
type: Opaque
stringData:
  TUNNEL_TOKEN: "eyJhIjoiNzQ1Zjg4ODcxNzg0YjE2OWFkNjA0NDNiMDA3MTBmOWEiLCJ0IjoiNzM2Y2E3YTUtNzdmMC00MjQ3LWE1M2MtMTBiMTE5NmIzOThhIiwicyI6IllqQXpOelUwTURndE9HUTRZeTAwTW1Jd0xUaGxaVFl0TUdFME5tTmhNREUxWmpWaCJ9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: personal-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secret
              key: TUNNEL_TOKEN
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            cpu: 100m
            memory: 50Mi
