{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="posts-list">
    {{ range .Pages }}
      <div class="card">
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        {{ if .Date }}
          <div class="post-date">{{ .Date.Format "January 2, 2006" }}</div>
        {{ end }}
        <p>{{ .Summary }}</p>
      </div>
    {{ end }}
  </div>
{{ end }}
