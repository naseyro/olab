<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <style>
    :root { --bg: #f8f9fa; --text: #212529; --accent: #0066cc; --border: #e0e0e0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    nav { display: flex; gap: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { border: 1px solid var(--border); padding: 1rem 1.2rem; border-radius: 6px; margin-bottom: 1rem; background: #fff; }
    .post-date { color: #6c757d; font-size: 0.88rem; margin-bottom: 0.5rem; }
    code { background: #e9ecef; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
    pre code { display: block; padding: 1rem; overflow-x: auto; }
  </style>
</head>
<body>
  <nav>
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </nav>

  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
