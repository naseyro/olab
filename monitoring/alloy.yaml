apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-node-discovery
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-node-discovery
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-node-discovery
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
data:
  config.alloy: |
    logging {
      level = "info"
    }

    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        regex         = "(.+)"
        replacement   = "$1:9100"
        target_label  = "__address__"
      }

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }

      rule {
        target_label = "job"
        replacement  = "node-exporter"
      }

      rule {
        target_label = "cluster"
        replacement  = "olab-homelab"
      }
    }

    prometheus.scrape "node_exporter" {
      targets         = discovery.relabel.node_exporter.output
      scrape_interval = "15s"
      scrape_timeout  = "10s"
      forward_to      = [prometheus.remote_write.victoriametrics.receiver]
    }

    prometheus.scrape "kube_state_metrics" {
      targets = [
        {
          __address__ = "kube-state-metrics.monitoring.svc.cluster.local:8080",
          job         = "kube-state-metrics",
          instance    = "olab-homelab",
          cluster     = "olab-homelab",
        },
      ]
      scrape_interval = "30s"
      scrape_timeout  = "10s"
      forward_to      = [prometheus.remote_write.victoriametrics.receiver]
    }

    prometheus.remote_write "victoriametrics" {
      endpoint {
        url = "http://10.200.0.1:8429/api/v1/write"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: collector
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: alloy-data
          emptyDir: {}
